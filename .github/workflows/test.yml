name: Test packaging scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest

      - name: Run tests
        run: .venv/bin/python -m pytest tests -q
